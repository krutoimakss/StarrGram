name: Build Starrgram

on:
  workflow_dispatch:
    inputs:
      all_abis:
        ...

jobs:
name: Build Starrgram

on:
  workflow_dispatch:
    inputs:
      all_abis:
        description: "Собрать для всех процессоров (дольше). Обычно хватает arm64 (почти все телефоны)."
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Мой репозиторий (патч Starrgram)
        uses: actions/checkout@v4

      - name: Исходники Telegram (ровно та версия, под которую сделан патч)
        uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: 68c6775ac373f4bdb30ae9986282dd5ec0407756
          path: tg

      - name: Применить патч Starrgram
        working-directory: tg
        run: git apply --whitespace=nowarn ../starrgram.patch

      - name: Вписать ваши api_id и api_hash из секретов
        working-directory: tg
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::Не заданы секреты TG_API_ID и TG_API_HASH (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s|public static int APP_ID = .*;|public static int APP_ID = ${TG_API_ID};|" "$F"
          sed -i "s|public static String APP_HASH = .*;|public static String APP_HASH = \"${TG_API_HASH}\";|" "$F"
          grep -q "APP_ID = ${TG_API_ID};" "$F"
          grep -q "APP_HASH = \"${TG_API_HASH}\";" "$F"
          echo "api_id и api_hash вписаны"

      - name: Только arm64 (быстрее)
        if: ${{ !inputs.all_abis }}
        working-directory: tg
        run: sed -i 's|abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"|abiFilters "arm64-v8a"|' TMessagesProj_AppStandalone/build.gradle

      - name: Освободить место
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK, NDK и CMake
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Сборка APK
        working-directory: tg
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon --stacktrace

      - name: Готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: Starrgram-apk
          path: tg/TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
