name: Build Starrgram
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: 68c6775ac373f4bdb30ae9986282dd5ec0407756
          submodules: recursive
          path: tg
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        working-directory: tg
        env:
          ID: ${{ secrets.TG_API_ID }}
          HASH: ${{ secrets.TG_API_HASH }}
        run: |
          git apply ../starrgram.patch
          B=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s|int APP_ID = .*;|int APP_ID = $ID;|" $B
          sed -i "s|String APP_HASH = .*;|String APP_HASH = \"$HASH\";|" $B
          sed -i 's|abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"|abiFilters "arm64-v8a"|' TMessagesProj_AppStandalone/build.gradle
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null || true
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Starrgram-apk
          path: tg/TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
